server:
  port: 8002

spring:
  application:
    name: auth-service

  data:
    mongodb:
      uri: mongodb://localhost:27017/crash2cost

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000}

admin:
  secret: ${ADMIN_SECRET:crash2cost-admin-2024}

upload:
  directory: uploads

cors:
  allowed-origins: http://localhost:5173
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: "*"
  allow-credentials: true

logging:
  level:
    '[io.github.mrlevi1112]': DEBUG
    '[org.springframework.security]': DEBUG
    '[org.springframework.web]': INFO
